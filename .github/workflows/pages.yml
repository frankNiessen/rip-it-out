# The website (site/), published with GitHub Pages on every push to main that changes it.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# The page finds the newest release's downloads itself, so a release needs no rebuild.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/*.png"
      - "stemtool/static/fonts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/img _site/fonts
          cp site/*.html site/*.css site/*.js _site/
          cp site/img/* _site/img/
          cp docs/library.png docs/play-countin.png _site/img/
          cp stemtool/static/fonts/*.woff2 stemtool/static/fonts/OFL-*.txt _site/fonts/
          cp ios/RipItOut/Assets.xcassets/AppIcon.appiconset/icon-1024.png _site/icon.png
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
