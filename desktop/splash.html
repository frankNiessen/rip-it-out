<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Rip It Out</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #121416; color: #e6e9e4;
         font: 15px/1.5 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  main { text-align: center; max-width: 32rem; padding: 2rem; }
  h1 { margin: 0 0 1.25rem; font-size: 1.4rem; font-weight: 800; letter-spacing: -.01em;
       display: flex; align-items: center; justify-content: center; gap: .6rem; }
  h1::before { content: ""; width: .6rem; height: .6rem; background: #c6f432; }
  .msg { font-weight: 600; }
  .detail { color: #8a928e; font-size: .85rem; -webkit-user-select: text; user-select: text; overflow-wrap: anywhere; }
  .error .msg { color: #ff6b6b; }
  .bar { width: 8rem; height: 2px; margin: 1.5rem auto 0; background: #2a2f34; overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #c6f432; animation: run 1.1s ease-in-out infinite; }
  .error .bar { display: none; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
<main id="box">
  <h1>Rip It Out</h1>
  <div class="msg" id="msg"></div>
  <div class="detail" id="detail"></div>
  <div class="bar"></div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("msg").textContent = q.get("message") || "";
  document.getElementById("detail").textContent = q.get("detail") || "";
  if (q.get("error")) document.getElementById("box").classList.add("error");
</script>
</body>
</html>
